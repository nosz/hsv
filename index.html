<style>
:root{
  --pri:#0b5cad;--pri-d:#0a4a8c;--pri-l:#e4eefa;--herobg:linear-gradient(135deg,#d6e6f8,#e8eaf3);
  --bg:#f4f4f4;--card:#ffffff;--ink:#1f2026;--mute:#565860;--line:#e1e2e5;
  --blue:#0d2d6b;--green:#1b7a3d;--gold:#ffc800;--gold-ink:#5a4500;--purple:#3f4b66;
  --ok:#157a3a;--okbg:#e6f6ec;--bad:#b3261e;--badbg:#fdecea;
  --shadow:0 4px 0 rgba(0,0,0,.08),0 8px 22px rgba(0,0,0,.08);
  --r:20px;
  --font:"Trebuchet MS","Segoe UI","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  --pri:#5aa9ef;--pri-d:#0b5cad;--pri-l:#14263f;--herobg:linear-gradient(135deg,#12294a,#1b1f2b);
  --bg:#15161a;--card:#202228;--ink:#f1f2f4;--mute:#b4b6bd;--line:#34363e;
  --blue:#7db7f5;--green:#5ccf86;--gold:#ffc800;--gold-ink:#ffe28a;--purple:#9fb0d6;
  --ok:#5ccf86;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1d1b;
  --shadow:0 4px 0 rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.35);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --pri:#5aa9ef;--pri-d:#0b5cad;--pri-l:#14263f;--herobg:linear-gradient(135deg,#12294a,#1b1f2b);
    --bg:#15161a;--card:#202228;--ink:#f1f2f4;--mute:#b4b6bd;--line:#34363e;
    --blue:#7db7f5;--green:#5ccf86;--gold:#ffc800;--gold-ink:#ffe28a;--purple:#9fb0d6;
    --ok:#5ccf86;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1d1b;
    --shadow:0 4px 0 rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 var(--font);-webkit-text-size-adjust:100%}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
/* Kopf */
.top{background:var(--pri);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 3px 0 rgba(0,0,0,.18)}
:root[data-theme="dark"] .top{background:#0a4a8c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:#0a4a8c}}
.topin{max-width:1060px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:1.15rem;letter-spacing:.2px;min-height:44px;background:none;border:0;padding:0}
.brand .dot svg{width:24px;height:auto;display:block}.brand .dot{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--pri-d);display:grid;place-items:center;font-size:1.2rem;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.brand{text-align:left;line-height:1.2}.brand small{display:block;font-weight:800;font-size:.98rem;opacity:1;letter-spacing:.1px;margin-top:2px;line-height:1.25}
.spacer{flex:1}
.pill{background:rgba(0,0,0,.2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
.lang{display:flex;gap:6px}
.lang button,.theme{min-height:44px;min-width:44px;padding:6px 12px;border-radius:999px;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;font-weight:700}
.lang button[aria-pressed="true"]{background:#fff;color:var(--pri-d)}
.certitem{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}.certrow{display:flex;gap:8px;align-items:stretch}.certrow .certbar{flex:1}.sharecert.sm{min-height:44px;padding:6px 14px;white-space:nowrap}
.nextcol{display:flex;flex-direction:column;gap:10px;align-items:stretch;flex:1 1 100%;max-width:560px}.nextcol .btn{justify-content:center}
.sharecert{gap:10px;display:inline-flex;align-items:center}.sharecert .shico{display:inline-flex;flex:none}.sharecert .shico svg{display:block}
.sharecert.big{min-height:64px;padding:12px 28px;font-size:1.15rem;font-weight:800;line-height:1.25;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.22),0 12px 28px rgba(11,92,173,.38)}
.sharecert.big:hover{transform:translateY(-1px)}
.btn.mini{min-height:40px;padding:6px 16px;font-size:.92rem;font-weight:700;box-shadow:none;opacity:.92}
.theme.off{position:relative;opacity:.75}.theme.off::after{content:"";position:absolute;left:9px;right:9px;top:50%;height:3px;border-radius:2px;background:#fff;box-shadow:0 0 0 1.5px var(--pri);transform:rotate(-45deg)}
.theme{font-size:1.1rem;padding:0;display:inline-flex;align-items:center;justify-content:center;line-height:1}.theme svg{display:block;flex:none}
/* Layout */
main{max-width:1060px;margin:0 auto;padding:20px 16px 24px;outline:none}
.hero{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;position:relative;overflow:hidden;border:2px solid var(--line)}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--herobg)}
.hero>*{position:relative}
.hero h1{margin:0 0 6px;font-size:clamp(1.5rem,4.5vw,2.2rem);line-height:1.2}
.hero p{margin:0 0 12px;color:var(--mute)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.chip.coin b{color:#3b2d00;background:var(--gold);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:background .6s}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:1.3rem}
h2.sec{margin:28px 0 12px;font-size:1.3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.lcard{--c:var(--pri);text-align:left;background:var(--card);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:170px;transition:transform .18s,box-shadow .18s;animation:pop .5s both}
.lcard:hover{transform:translateY(-4px) rotate(-.4deg)}
.lcard:active{transform:translateY(1px)}
.lcard .ico{font-size:2rem;line-height:1}
.lcard h3{margin:0;font-size:1.08rem;line-height:1.3}
.lcard p{margin:0;color:var(--mute);font-size:.92rem}
.lcard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--mute);font-weight:700}
.stars{letter-spacing:2px;font-size:1.15rem}
.stars .off{opacity:.3;filter:grayscale(1)}
.nr{font-weight:800;color:var(--c)}

{ id:"gruendung", ico:"⚽", c:"var(--pri)", min:1,
 t:["Blitzstart: 1887 in 60 Sekunden","Quick start: 1887 in 60 seconds","Blitzstart: 1887 in 60 Sekunnen"],

 cards:[
  [["Zwei Vereine, zwei Daten","Two clubs, two dates","Twee Vereene, twee Daten"],
   ["Am 29. September 1887 entstand der Sport-Club Germania von 1887 aus dem Wandsbek-Marienthaler SC und dem Hohenfelder SC. Er gilt als einer der drei Stammvereine des HSV. Am 1. Juni 1888 folgte der Hamburger Fußball-Club, Hamburgs erster reiner Fußballverein.","On 29 September 1887 Sport-Club Germania von 1887 emerged from Wandsbek-Marienthaler SC and Hohenfelder SC. It counts as one of the three parent clubs of HSV. On 1 June 1888 the Hamburger Fußball-Club followed, Hamburg's first pure football club.","Op 29. September 1887 keem de Sport-Club Germania vun 1887 ut den Wandsbek-Marienthaler SC un den Hohenfelder SC. He gilt as een vun de dree Stammvereene vun'n HSV. Op 1. Juni 1888 keem de Hamburger Fußball-Club, Hamborgs eerst reen Footballvereen."]],
  [["Vom HFC zum HSV","From HFC to HSV","Vun'n HFC to'n HSV"],
   ["1914 wurde der Hamburger Fußball-Club in Hamburger Sport-Verein umbenannt, weil sich auch Leichtathletik etabliert hatte. 1919 nahm der Verein den FC Falke 06 und den SC Germania von 1887 auf. 1932 wurde der 29. September 1887 als offizielles Gründungsdatum übernommen.","In 1914 the Hamburger Fußball-Club was renamed Hamburger Sport-Verein because athletics had become established too. In 1919 the club took in FC Falke 06 and SC Germania von 1887. In 1932 it adopted 29 September 1887 as its official founding date.","1914 wöör de Hamburger Fußball-Club to'n Hamburger Sport-Verein ümbenöömt, wiel nu ok Leichtathletik dorto höör. 1919 nöhm de Vereen den FC Falke 06 un den SC Germania vun 1887 op. 1932 wöör de 29. September 1887 as offiziell Gründungsdag övernahmen."]],
  [["Farben und Raute","Colours and diamond","Farven un Raut"],

 cards:[
  [["Sechs Meisterschaften","Six championships","Söss Meisterschaften"],
   ["Der HSV wurde Deutscher Meister in den Jahren 1923, 1928, 1960, 1979, 1982 und 1983. Der Titel 1960 gelang mit einem 3:2 im Finale gegen den 1. FC Köln.","HSV became German champion in 1923, 1928, 1960, 1979, 1982 and 1983. The 1960 title came with a 3-2 win over 1. FC Köln in the final.","De HSV wöör Düütsche Meister in de Johren 1923, 1928, 1960, 1979, 1982 un 1983. De Titel 1960 geluck mit en 3:2 in't Finale gegen den 1. FC Köln."]],
  [["Der erste Bundesliga-Titel","The first Bundesliga title","De eerste Bundesliga-Titel"],
   ["Am 9. Juni 1979 gewann der HSV am letzten Spieltag die Meisterschaft: den ersten Titel seit Gründung der Bundesliga und den vierten insgesamt. 1982 folgte der nächste Titel, 1983 wurde er erfolgreich verteidigt.","On 9 June 1979 HSV won the title on the final matchday: the first since the Bundesliga was founded and the fourth overall. The next title followed in 1982, and in 1983 it was successfully defended.","Op 9. Juni 1979 wunn de HSV an'n lesten Speeldag de Meisterschaft: den eersten Titel siet de Bundesliga gründt wöör un den veerten insgesamt. 1982 keem de negste Titel, 1983 wöör he erfolgriek verdeedigt."]],
  [["Pokale","Cups","Pokalen"],
   ["Den DFB-Pokal gewann der HSV 1963, 1976 und 1987. 1973 gab es den Ligapokal mit einem 4:0 gegen Borussia Mönchengladbach.","HSV won the DFB-Pokal in 1963, 1976 and 1987. In 1973 came the Ligapokal with a 4-0 win over Borussia Mönchengladbach.","Den DFB-Pokal wunn de HSV 1963, 1976 un 1987. 1973 geev dat den Ligapokal mit en 4:0 gegen Borussia Mönchengladbach."]]

  [["Uns Uwe","Uns Uwe","Uns Uwe"],
   ["Uwe Seeler debütierte im August 1953 mit 16 Jahren, die Fans nannten ihn „Uns Uwe“. 1960 wurde er der erste „Fußballer des Jahres“ in Deutschland, 1995 wurde er Präsident des HSV.","Uwe Seeler made his debut in August 1953 aged 16, and the fans called him “Uns Uwe”. In 1960 he became Germany's first “Footballer of the Year”, and in 1995 he became president of HSV.","Uwe Seeler debütier in'n August 1953 mit 16 Johr, de Fans nöömt em „Uns Uwe“. 1960 wöör he de eerste „Footballer vun't Johr“ in Düütschland, 1995 wöör he Präsident vun'n HSV."]],
  [["Die Helden von 1982 und 1983","The heroes of 1982 and 1983","De Helden vun 1982 un 1983"],
   ["Horst Hrubesch war 1982 mit 27 Toren bester Torschütze. Felix Magath schoss 1983 das Tor zum 1:0 im Europapokal-Finale in Athen. Im November 1980 holte der HSV Franz Beckenbauer, im Mai 1977 Kevin Keegan vom FC Liverpool.","Horst Hrubesch was top scorer in 1982 with 27 goals. In 1983 Felix Magath scored the 1-0 in the European Cup final in Athens. In November 1980 HSV signed Franz Beckenbauer, in May 1977 Kevin Keegan from FC Liverpool.","Horst Hrubesch weer 1982 mit 27 Dören de beste Dörenschütt. Felix Magath schööt 1983 de Dör to'n 1:0 in't Europapokal-Finale in Athen. In'n November 1980 hool de HSV Franz Beckenbauer, in'n Mai 1977 Kevin Keegan vun'n FC Liverpool."]],
  [["Der Trainer und der Masseur","The coach and the masseur","De Trainer un de Masseur"],
   ["Der Österreicher Ernst Happel wurde am 1. Juli 1981 Trainer und hält mit 240 Pflichtspielen den Vereinsrekord für Trainer. Kult-Masseur Hermann Rieger starb im Februar 2014; am Stadion erinnert eine Bronzestatue an ihn.","The Austrian Ernst Happel became coach on 1 July 1981 and holds the club record for coaches with 240 competitive matches. Cult masseur Hermann Rieger died in February 2014; a bronze statue at the stadium remembers him.","De Öösterriker Ernst Happel wöör an 1. Juli 1981 Trainer un hett mit 240 Pflichtspelen den Vereensrekord för Trainers. Kult-Masseur Hermann Rieger sturv in'n Februar 2014; an't Stadion dröggt en Bronzestatue an em."]]

{ id:"europa", ico:"🌍", c:"var(--purple)", min:3,

 sub:["Zwei Europapokale und ein paar bittere Finals","Two European trophies and a few bitter finals","Twee Europapokalen un en poor bitter Finals"],
 cards:[
  [["Zwei Europapokale","Two European trophies","Twee Europapokalen"],
   ["1977 gewann der HSV den Europapokal der Pokalsieger mit 2:0 gegen RSC Anderlecht in Amsterdam, mit späten Toren von Georg Volkert und Felix Magath. 1983 folgte der Europapokal der Landesmeister.","In 1977 HSV won the European Cup Winners' Cup with a 2-0 against RSC Anderlecht in Amsterdam, with late goals from Georg Volkert and Felix Magath. In 1983 the European Cup followed.","1977 wunn de HSV den Europapokal vun de Pokalsegers mit 2:0 gegen RSC Anderlecht in Amsterdam, mit lat Dören vun Georg Volkert un Felix Magath. 1983 keem de Europapokal vun de Landsmeisters."]],
  [["Athen 1983","Athens 1983","Athen 1983"],
   ["Am 25. Mai 1983 besiegte der HSV in Athen Juventus Turin mit 1:0. Das Tor schoss Felix Magath. hsv.de nennt es den größten Triumph der Vereinsgeschichte.","On 25 May 1983 HSV beat Juventus 1-0 in Athens. Felix Magath scored the goal. hsv.de calls it the biggest triumph in the club's history.","An 25. Mai 1983 slööch de HSV in Athen Juventus Turin mit 1:0. De Dör schööt Felix Magath. hsv.de nömt dat den gröttsten Triumph in de Vereensgeschicht."]],
  [["Bittere Finals","Bitter finals","Bitter Finals"],
   ["Final-Niederlagen gab es 1968 (0:2 gegen AC Mailand im Pokalsieger-Wettbewerb), 1980 (0:1 gegen Nottingham Forest im Landesmeister-Pokal) und 1982 (UEFA-Cup gegen IFK Göteborg). Im Dezember 1983 verlor der HSV das Weltpokal-Finale in Tokio gegen Grêmio Porto Alegre.","Final defeats came in 1968 (0-2 against AC Milan in the Cup Winners' Cup), 1980 (0-1 against Nottingham Forest in the European Cup) and 1982 (UEFA Cup against IFK Göteborg). In December 1983 HSV lost the Intercontinental Cup final in Tokyo to Grêmio Porto Alegre.","Finalnederlagen geev dat 1968 (0:2 gegen AC Mailand in'n Pokalsegers-Wettbewarb), 1980 (0:1 gegen Nottingham Forest in'n Landsmeister-Pokal) un 1982 (UEFA-Cup gegen IFK Göteborg). In'n Dezember 1983 verleer de HSV dat Weltpokal-Finale in Tokio gegen Grêmio Porto Alegre."]]
 ],
 pro:["Im April 1961 sahen 77.600 Zuschauer das Halbfinal-Rückspiel gegen den FC Barcelona im alten Volksparkstadion, bis heute Vereinsrekord. Der HSV verlor nach einem Entscheidungsspiel.","In April 1961, 77,600 spectators watched the semi-final second leg against FC Barcelona at the old Volksparkstadion, a club record that still stands. HSV lost after a play-off.","In'n April 1961 sehgen 77.600 Tokiekers dat Halvfinal-Rückspeel gegen den FC Barcelona in't ole Volksparkstadion, bit hüüt Vereensrekord. De HSV verleer na en Entscheidungsspeel."],
